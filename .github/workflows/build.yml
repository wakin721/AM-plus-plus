name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      AMPP_RELEASE_STORE_FILE: ${{ github.workspace }}/am-plus-plus-release.jks
      AMPP_RELEASE_STORE_PASSWORD: ${{ secrets.AMPP_RELEASE_STORE_PASSWORD }}
      AMPP_RELEASE_KEY_ALIAS: ${{ secrets.AMPP_RELEASE_KEY_ALIAS }}
      AMPP_RELEASE_KEY_PASSWORD: ${{ secrets.AMPP_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify pinned glass renderer
        run: python3 scripts/verify-glass-reference.py

      - name: Verify architecture and exact host profiles
        run: |
          python3 scripts/verify-architecture.py
          python3 scripts/verify-profile-data.py

      - name: Verify USB Direct PCM and playback clock
        run: |
          mkdir -p build/usb-direct-native
          g++ -std=c++17 -pthread -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" scripts/tests/usb-direct/native/UsbDirectRingTest.cpp -o build/usb-direct-native/ring-test
          build/usb-direct-native/ring-test

      - name: Prepare release signing
        id: release_signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AMPP_RELEASE_KEYSTORE_BASE64: ${{ secrets.AMPP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$AMPP_RELEASE_KEYSTORE_BASE64" && \
                -n "$AMPP_RELEASE_STORE_PASSWORD" && \
                -n "$AMPP_RELEASE_KEY_ALIAS" && \
                -n "$AMPP_RELEASE_KEY_PASSWORD" ]]; then
            printf '%s' "$AMPP_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$AMPP_RELEASE_STORE_FILE"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Release signing secrets are not configured; building a debug APK instead.'
          fi

      - name: Build independent plugin example and SDK
        run: |
          chmod +x gradlew
          python3 scripts/build-plugin-example.py

      - name: Build and test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chmod +x gradlew
          if [[ "${{ steps.release_signing.outputs.available }}" == 'true' ]]; then
            ./gradlew test :app:lintDebug :app:lintVitalRelease :glass:lintDebug :host-applemusic:lintDebug :plugin-api:lintDebug :plugin-runtime:lintDebug :app:assembleRelease -PpluginFixture="$PWD/build/plugin-example/basic-plugin.zip" --no-daemon
          else
            ./gradlew test :app:lintDebug :app:lintVitalRelease :glass:lintDebug :host-applemusic:lintDebug :plugin-api:lintDebug :plugin-runtime:lintDebug :app:assembleDebug -PpluginFixture="$PWD/build/plugin-example/basic-plugin.zip" --no-daemon
          fi

      - name: Verify release signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_signing.outputs.available == 'true'
        run: |
          verification="$($ANDROID_HOME/build-tools/37.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)"
          printf '%s\n' "$verification"
          printf '%s\n' "$verification" | grep -q 'Verified using v2 scheme.*: true'
          if printf '%s\n' "$verification" | grep -q 'CN=Android Debug'; then
            echo 'Refusing to publish an APK signed with the Android debug certificate.' >&2
            exit 1
          fi

      - name: Build and test feature branch or pull request
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          chmod +x gradlew
          ./gradlew test :app:lintDebug :app:lintVitalRelease :glass:lintDebug :host-applemusic:lintDebug :plugin-api:lintDebug :plugin-runtime:lintDebug :app:assembleDebug -PpluginFixture="$PWD/build/plugin-example/basic-plugin.zip" --no-daemon

      - name: Verify USB Direct native APK packaging
        run: |
          python3 -m unittest discover -s scripts/tests -p test_verify_native_apk.py
          python3 scripts/verify-native-apk.py 'app/build/outputs/apk/*/*.apk'

      - name: Upload plugin SDK and example
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-plugin-sdk-v1
          path: build/plugin-example/*
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: AM-plus-plus-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || steps.release_signing.outputs.available != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: AM-plus-plus-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
